<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Wayfare</title>
<link rel="icon" href="/icon-192.png" />
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0e14;
    color: #f0f2f5;
    padding: 24px;
    text-align: center;
  }
  .ring {
    width: 72px; height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    border: 2px solid rgba(45, 212, 191, 0.4);
    display: grid; place-items: center;
    font-size: 30px;
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #9eaab9; max-width: 34ch; }
  button {
    margin-top: 24px;
    padding: 10px 22px;
    border: 0;
    border-radius: 10px;
    background: #14b8a6;
    color: #04211d;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2dd4bf; }
  .hint { margin-top: 18px; font-size: 12px; color: #758396; }
</style>
</head>
<body>
  <main>
    <div class="ring">✈</div>
    <h1>You're off the grid</h1>
    <p>This page needs a connection. Your trips, itinerary and documents you've already opened are still available offline.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint">Queued changes sync automatically when you reconnect.</p>
  </main>
</body>
</html>
